dataset:
  model profile: /home/rbeutel/MEOPAR/analysis/reshapr_files/model_profile.yaml
  time base: day
  variables group: primary

dask cluster: nibi_cluster.yaml

start date: 2021-01-01
end date: 2021-12-31

extract variables:
  - votemper
  - vosaline
  - dissolved_oxygen
  - dissolved_inorganic_carbon
  - total_alkalinity
  - nitrate

selection:
  depth:
    # NOTE: use depth level numbers, not depths in meters
    depth min: 23
    depth max: 24
  grid y:
    y min: 80
    y max: 130
  grid x:
    x min: 220
    x max: 270

extracted dataset:
  name: All_2021spin_primarytracers_pug50
  description: Primary tracers from All change scenario, Puget region, ~50 m depth;
              y=80:130, x=220:270, deptht=23:24
  dest dir: /home/rbeutel/MEOPAR/analysis/output/
